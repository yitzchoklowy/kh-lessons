        <svg viewBox="0 0 620 700" role="img" id="art"
             aria-label="The large circle carries the small circle round the earth while the moon travels round the small circle the other way, against a ring of the twelve mazalos.">
          <defs>
            <marker id="tipMean" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
              <path d="M0,0 L10,5 L0,10 z" fill="var(--mean)"></path>
            </marker>
            <marker id="tipMas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
              <path d="M0,0 L10,5 L0,10 z" fill="var(--mas)"></path>
            </marker>

            <!--@include partials/bodies.svg-->
          </defs>

          <g id="ring"></g>

          <circle cx="310" cy="372" r="160" fill="none" stroke="var(--mean)" stroke-width="1.6" stroke-opacity=".3"></circle>
          <circle id="grabDef" class="grab" cx="310" cy="372" r="160" fill="none" stroke="transparent" stroke-width="22" pointer-events="stroke"></circle>
          <line x1="310" y1="372" x2="534" y2="372" stroke="currentColor" stroke-opacity=".2" stroke-width="1"></line>
          <text x="539" y="376" font-size="11" fill="currentColor" fill-opacity=".45">0°</text>

          <path id="arcMean" fill="none" stroke="var(--mean)" stroke-width="2.6"
                marker-end="url(#tipMean)"></path>


          <line id="ptrMean" x1="310" y1="372" x2="523" y2="372" stroke="var(--mean)" stroke-width="1.5"
                stroke-dasharray="5 3"></line>

          <circle id="epi" cx="470" cy="372" r="40" fill="none" stroke="var(--mas)" stroke-width="1.6" stroke-opacity=".3"></circle>
          <circle id="grabEpi" class="grab" cx="470" cy="372" r="40" fill="none" stroke="transparent" stroke-width="22" pointer-events="stroke"></circle>
          <path id="arcEpi" fill="none" stroke="var(--mas)" stroke-width="2.6" marker-end="url(#tipMas)"></path>
          <circle id="epiC" cx="460" cy="372" r="2.6" fill="var(--mas)"></circle>
          <line id="farLine" stroke="var(--mas)" stroke-width="1.6" stroke-opacity=".95"></line>
          <text id="farLbl" font-size="9.5" fill="var(--mas)" fill-opacity=".9" text-anchor="middle">0°</text>

          <line id="sightLine" x1="310" y1="372" x2="523" y2="372" stroke="var(--ink)" stroke-width="1.5"></line>
          <use id="moonBody" href="#gMoon" x="0" y="0"></use>

          <use href="#gEarth" x="310" y="372"></use>
          <text x="310" y="398" font-size="12" text-anchor="middle" fill="currentColor">הארץ</text>

          <!-- the live degrees, pinned to one corner -->
          <g id="corner">
            <rect x="8" y="8" width="252" height="62" rx="8" fill="var(--sunk)" stroke="currentColor"
                  stroke-opacity=".14"></rect>
            <circle cx="21" cy="27" r="4" fill="var(--mean)"></circle>
            <text x="32" y="31" font-size="11.5" fill="currentColor" fill-opacity=".7">אמצע הירח</text>
            <text id="cMean" x="248" y="31" font-size="13" text-anchor="end" fill="var(--mean)"
                  font-family="IBM Plex Mono, monospace">—</text>
            <circle cx="21" cy="53" r="4" fill="var(--mas)"></circle>
            <text id="cMasLbl" x="32" y="57" font-size="11.5" fill="currentColor" fill-opacity=".7">אמצע המסלול</text>
            <text id="cMas" x="248" y="57" font-size="13" text-anchor="end" fill="var(--mas)"
                  font-family="IBM Plex Mono, monospace">—</text>
          </g>

          <text x="310" y="684" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity=".45" id="scaleNote">
            Small circle drawn larger than life.
          </text>
        </svg>
      </div>

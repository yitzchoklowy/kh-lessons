<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:wght@400;500;600&display=swap">

<style>
  <!--@include partials/wheel.css-->

  <!--@include partials/chart.css-->

  <!--@include partials/practice.css-->

  /* the wheel stands on its own, and takes the whole working column */
  .page.solo .stage { grid-template-columns:1fr; }
  .page.solo .art { max-width:none; margin:0; }
  .page.solo .dials { border-left:0; border-top:1px solid var(--line);
                     grid-template-columns:repeat(auto-fit,minmax(11rem,1fr)); display:grid; gap:.9rem 1.2rem; }
  .rchart, .drill { margin-left:auto; margin-right:auto; max-width:44rem; }
  .page.solo, .page { max-width:92rem; }

  /* ── his words on the right, the working beside them ── */
  .body { display:grid; grid-template-columns:minmax(17rem,23rem) minmax(0,1fr);
          gap:1.5rem; align-items:start; direction:rtl; margin-top:1.2rem; }
  .side { position:sticky; top:.8rem; max-height:calc(100vh - 1.6rem); overflow:auto;
          display:grid; gap:.8rem; align-content:start; }
  .said, .why { background:var(--card); border:1px solid var(--line); border-radius:11px;
                box-shadow:var(--shadow); padding:.35rem .95rem .2rem; }
  .said > summary, .why > summary {
                    cursor:pointer; list-style:none; font-family:var(--serif); font-weight:700;
                    font-size:1.05rem; color:var(--muted); padding:.55rem 0;
                    display:flex; align-items:baseline; gap:.5rem; }
  .said > summary::-webkit-details-marker, .why > summary::-webkit-details-marker { display:none; }
  .said > summary::before, .why > summary::before { content:"▾"; font-size:.8rem; color:var(--faint); }
  .said:not([open]) > summary::before, .why:not([open]) > summary::before { content:"▸"; }
  .said > summary .mark, .why > summary .mark {
                          font-family:var(--mono); font-size:.68rem; letter-spacing:.05em;
                          color:var(--faint); direction:ltr; margin-inline-start:auto; }
  .why > summary { color:var(--brass); }
  .why > summary .mark { direction:rtl; font-family:var(--serif); letter-spacing:0; }
  .why-in { direction:rtl; text-align:right; padding-bottom:.8rem; font-size:.94rem;
            line-height:1.75; color:var(--muted); }
  .why-in p { margin:0 0 .7rem; }
  .why-in b { color:var(--ink); font-weight:600; }
  .why-in .src { font-size:.78rem; color:var(--faint); font-family:var(--serif);
                 border-top:1px solid var(--hair); padding-top:.5rem; margin-bottom:0; }
  .why-in figure { margin:.8rem 0; }
  .why-in svg { display:block; width:100%; height:auto; }
  .why-in figcaption { font-size:.78rem; color:var(--faint); margin-top:.35rem; }
  .said-in { padding-bottom:.7rem; }
  .said .halacha { font-size:1.06rem; line-height:1.85; margin:.55rem 0 0; }
  .said .halacha.lead { font-size:1.12rem; margin-top:0; }
  .work { min-width:0; }
  /* the diagram is the point of the column; the reading things keep a measure */
  .work > .rchart, .work > .drill, .work > .book, .work > .verdict,
  .work > .part, .work > .pick {
    max-width:46rem; margin-left:auto; margin-right:0; }
  .page.solo .note, .page.solo .pagenav { max-width:none; }

  @media (max-width:980px) {
    .body { grid-template-columns:1fr; }
    /* no columns, so the working comes first and his words after it */
    .side { position:static; max-height:none; order:2; }
    .work > .rchart, .work > .drill, .work > .book, .work > .verdict,
    .work > .part, .work > .pick { max-width:none; }
  }
  .rchart td.in, .rchart th:first-child { direction:rtl; text-align:right; }
  .rchart td.moves, .rchart td.use, .rchart th { direction:ltr; }
  .rc-head { direction:rtl; }
  .rc-note, .rc-sum { direction:rtl; text-align:right; }
  .rc-sum .eq { direction:ltr; text-align:left; }
  .part { max-width:44rem; margin:2rem auto 0; }

  /* The diagram takes the working column's whole width, and the chart sits
     directly under it — a row is still pressed and seen in one glance, and the
     drawing is no longer squeezed into a third of the page. */
  .pair { direction:rtl; display:flex; flex-direction:column; gap:1rem; margin-top:0; }
  .pair .rig { margin:0; order:-1; }
  .pair .rchart, .pair .book, .pair .stack { margin:0; max-width:46rem;
    margin-left:auto; margin-right:0; }
  .pair .stack { width:100%; }
  @media (max-width:980px) {
    .pair .rchart, .pair .book, .pair .stack { max-width:none; }
  }
  .book, .drill { max-width:44rem; margin-left:auto; margin-right:auto; }
  .book h3 { direction:rtl; text-align:right; }
  .led td.l { direction:rtl; text-align:right; }
  /* A figure is LTR wherever it lands. Left to the page's own direction, the
     bidi algorithm reads "70° 30′ 40.0″" as three neutral-terminated runs and
     hands them back in the other order — 40.0″ first, the degrees last — which
     looks like a figure and is not one. Every column that holds a number says
     so itself, rather than trusting the block it sits in. */
  table.led td.a, table.led td.t, table.cmp td.t { direction:ltr; }

  .book .cap { direction:rtl; text-align:right; }

  /* the two figures a page draws beside its table: his window, and his curve */
  .strip, .curve { margin-top:.9rem; padding-top:.7rem; border-top:1px solid var(--hair); }
  .strip svg, .curve svg { display:block; width:100%; height:auto; }

  /* his own worked figures, set beside the ones that fall out */
  .agree { margin-top:.9rem; padding-top:.7rem; border-top:1px solid var(--line); }
  .agree h4 { margin:0 0 .5rem; font-family:var(--serif); font-size:1.02rem;
              direction:rtl; text-align:right; color:var(--mean); }
  table.cmp { width:100%; border-collapse:collapse; font-size:.79rem; }
  table.cmp td { padding:.22rem 0; border-bottom:1px solid var(--hair); }
  table.cmp tr:last-child td { border-bottom:0; }
  table.cmp td.l { direction:rtl; text-align:right; color:var(--muted); padding-left:.5rem; }
  table.cmp td.a { direction:rtl; text-align:right; font-family:var(--serif);
                   color:var(--ink); white-space:nowrap; padding-left:.6rem; }
  table.cmp td.t { text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums;
                   color:var(--faint); white-space:nowrap; }
  table.cmp td.o { text-align:right; font-family:var(--mono); color:var(--faint);
                   width:3.2rem; }

  /* The drill speaks Hebrew like everything else; only the answer boxes, the
     chapter mark and the buttons keep their own direction. */
  .drill, .dr-head, .dr-note, .dr-case, .dr-ask, .dr-say, .dr-foot { direction:rtl; text-align:right; }
  .dr-ref { direction:ltr; }
  .dr-row { direction:rtl; margin-left:0; margin-inline-start:1.6rem; }
  .dr-row input { direction:ltr; }
  .dr-row .unit { margin-right:0; margin-inline-end:.35rem; }
  .dr-say .why { direction:rtl; text-align:right; }

  table.cmp td.t { padding-left:.5rem; }

  /* On a phone the ledger's three columns have no room to stay on one line */
  @media (max-width:560px) {
    table.led td.a, table.led td.t { font-size:.72rem; }
    table.led td.a { padding-right:.4rem; }
    table.led td.l { padding-right:.3rem; word-break:break-word; }
  }
</style>

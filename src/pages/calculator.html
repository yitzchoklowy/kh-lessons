<title>כל החשבון</title>
<!--@include partials/lesson-head.html-->
<style>
  <!--@include partials/kh17.css-->

  /* pick a night: a civil date, a day count, or the next ליל ל׳ */
  .pick { margin-top:1.2rem; background:var(--card); border:1px solid var(--line);
          border-radius:11px; box-shadow:var(--shadow); padding:.9rem 1.1rem;
          direction:rtl; display:flex; flex-wrap:wrap; align-items:center; gap:.55rem .8rem; }
  .pick label { font-size:.85rem; color:var(--muted); display:flex; align-items:center; gap:.4rem; }
  .pick input { font:inherit; font-family:var(--mono); font-size:.88rem; color:var(--ink);
                background:var(--sunk); border:1px solid var(--line); border-radius:7px;
                padding:.34rem .5rem; direction:ltr; }
  .pick input[type="number"] { width:7.5rem; text-align:right; }
  .pick button { font:inherit; font-size:.85rem; cursor:pointer; padding:.36rem .85rem;
                 border-radius:7px; border:1px solid var(--line); background:var(--card);
                 color:var(--muted); font-family:var(--serif); }
  .pick button:hover { border-color:var(--brass); color:var(--ink); }
  .pick .grow { margin-inline-start:auto; font-size:.82rem; color:var(--faint); }

  /* the ledger runs the whole way, so let it breathe and mark its chapters */
  table.led tr.head td { padding-top:1rem; }
  table.led tr.head td.l { color:var(--c); font-weight:700; font-family:var(--serif);
                           font-size:1rem; border-top:1px solid var(--line); padding-top:.7rem; }
  table.led tr.head td.a, table.led tr.head td.t { border-top:1px solid var(--line); }
  table.led td.l a { color:inherit; text-decoration:none; border-bottom:1px dotted var(--faint); }
  table.led td.l a:hover { color:var(--brass); border-bottom-color:var(--brass); }
</style>

<div class="page solo" data-emph="gap">

  <header>
    <h1 class="bigtitle">כל החשבון</h1>
    <div class="eyebrow"><a href="https://mg.alhatorah.org/Full/Rambam_Mishneh_Torah_Sefer_Zemanim_Kiddush_HaChodesh/17" target="_blank" rel="noopener">רמב״ם · הלכות קידוש החודש י״א–י״ז</a></div>
    <p class="halacha lead">ועל דרך זו תעשה, ותדע קשת הראייה כמה מעלות וכמה חלקים יש בה <b class="mean">בכל ליל ראייה שתרצה לעולם</b>:</p>
  </header>

  <div class="pick">
    <label>ליל <input type="date" id="date"></label>
    <label>מן העיקר <input type="number" id="dayn" step="1"> ימים</label>
    <button type="button" id="lil">ליל ל׳ הקרוב</button>
    <button type="button" id="his">לילו של הרמב״ם</button>
    <span class="grow" id="stamp">—</span>
  </div>

  <div class="verdict" id="verdict" style="--c:var(--mean)"></div>

  <div class="pair">
    <div class="stack">
      <div class="book m" id="work">
        <h3><i></i>מן העיקר עד קשת הראייה</h3>
        <p class="cap">י״ב–י״ז · כל שורה קשורה לשיעור שלה</p>
        <table class="led"><tbody id="led"></tbody></table>
      </div>
      <div class="book s" id="figs">
        <h3><i></i>מה שרואים במערב</h3>
        <div id="sky"></div>
        <div id="chain"></div>
      </div>
    </div>
    <!--@include partials/wheel.html-->
  </div>

  <p class="note"><a href="kh17-22.html">כיצד — ייראה הלילה</a> · <a href="index.html">כל השיעורים</a></p>
</div>

<!--ENGINE-->

<script>
(function () {
  "use strict";
  <!--@include partials/chart-list.js-->
  <!--@include partials/kh15.js-->
  <!--@include partials/kh17.js-->
  <!--@include partials/wheel.js-->

  var HIS_DAY = 29;
  var EPOCH = Date.UTC(1178, 2, 30);

  function link(href, text) { return '<a href="' + href + '">' + text + "</a>"; }
  function civil(n) {
    return new Date(EPOCH + n * 86400000)
      .toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
  }

  function GAP_AT(n) {
    var v = chapter15At(n);
    return { sun: v.sunMean, moon: v.moonSight, merchak: v.merchak, kaful: v.kaful };
  }

  function head(name, mark) { return { l: name, s: mark, a: "", t: "", head: true }; }

  function rows(n) {
    var s = chapter15At(n), v = chapter17At(n), r = v.setRow;
    var out = [];

    out.push(head("מקום השמש האמיתי", "פרק י״ב–י״ג"));
    out.push({ l: link("kh12-sun-mean.html", "אמצע השמש"), s: "י״ב:א", a: "", t: degMin(s.sunMean) });
    out.push({ l: link("kh12-govah.html", "גובה השמש"), s: "י״ב:ב", a: "", t: degMin(s.sunApogee), drop: true });
    out.push({ l: "מסלול השמש", s: "י״ג:א", a: "", t: degMin(s.sunMaslul), drop: true });
    out.push({ l: "מנת המסלול", s: "י״ג:ד", a: (s.sunAdds ? "+ " : "− ") + degMin(s.sunMnat),
               t: degMin(s.sunTrue) });
    out.push({ l: "מקום השמש האמיתי", s: zodiacPosition(s.sunTrue).hebrew, a: "", t: degMin(s.sunTrue), out: true });

    out.push(head("מקום הירח האמיתי", "פרק י״ד–ט״ו"));
    out.push({ l: link("kh14-2.html", "אמצע הירח"), s: "י״ד:א–ב", a: "", t: degMin(s.moonMean) });
    out.push({ l: link("kh14-sun.html", "לשעת הראייה"), s: "י״ד:ה–ו",
               a: (s.season >= 0 ? "+ " : "− ") + Math.abs(Math.round(s.season * 60)) + "′",
               t: degMin(s.moonSight) });
    out.push({ l: link("kh14-3.html", "אמצע המסלול"), s: "י״ד:ג–ד", a: "", t: degMin(s.maslul), drop: true });
    out.push({ l: link("kh15-1.html", "מרחק הכפול"), s: "ט״ו:א", a: "× 2", t: degMin(s.kaful), drop: true });
    out.push({ l: link("kh15-3.html", "המסלול הנכון"), s: "ט״ו:ג", a: "+ " + s.add + "°", t: degMin(s.nachon) });
    out.push({ l: link("kh15-6.html", "מנת המסלול"), s: "ט״ו:ו · ב־" + s.asked + "°",
               a: (s.dir === "subtract" ? "− " : "+ ") + degMin(s.mnat), t: degMin(s.amiti) });
    out.push({ l: "מקום הירח האמיתי", s: moonPlace(s.amiti), a: "", t: degMin(s.amiti), out: true });

    out.push(head("רוחב הירח", "פרק ט״ז"));
    out.push({ l: link("kh16-2.html", "מקום הראש"), s: "ט״ז:ב–ה", a: "", t: degMin(v.rosh), drop: true });
    out.push({ l: link("kh16-9.html", "רוחב ראשון"), s: v.north ? "צפוני" : "דרומי", a: "",
               t: degMin(v.rochav1), out: true });

    out.push(head("חשבונות הראייה", "פרק י״ז"));
    out.push({ l: link("kh17-1.html", "אורך ראשון"), s: "י״ז:א", a: "− " + degMin(s.sunTrue),
               t: degMin(v.orech1) });
    /* Past a hundred and eighty the moon is not ahead of the sun by a small arc,
       and this is no ליל ראייה: his חשבונות take a first crescent. Say so, and
       print nothing that would not mean anything. */
    if (v.orech1 > 180) {
      out.push({ l: "אין כאן ליל ראייה — הירח עדיין אחר השמש", s: "י״ז:א",
                 a: "", t: "—", out: true });
      return { rows: out, v: v, live: false };
    }
    out.push({ l: link("kh17-5.html", "שינוי מראה האורך"), s: "י״ז:ה · " + v.mazal.hebrew,
               a: "− " + chal(v.lonChalakim), t: degMin(v.orech2) });
    out.push({ l: link("kh17-7.html", "שינוי מראה הרוחב"), s: "י״ז:ח · " + (v.north ? "תגרע" : "תוסיף"),
               a: (v.north ? "− " : "+ ") + v.latChalakim + "′", t: degMin(v.rochav2) });
    out.push({ l: link("kh17-10.html", v.band.fraction === 0 ? "אין נליזת מעגל" : "מעגל הירח — " + v.band.phrase),
               s: "י״ז:י", a: "", t: degMin(v.maagal), drop: true });
    out.push({ l: v.maagalAdds ? "תוסיף המעגל" : "תגרע המעגל", s: "י״ז:י״א",
               a: (v.maagalAdds ? "+ " : "− ") + degMin(v.maagal), t: degMin(v.orech3) });
    out.push({ l: link("kh17-12.html", r.operation === "none" ? "תניח כמות שהוא" : fracWord(r)),
               s: "י״ז:י״ב · " + v.mazal.hebrew,
               a: r.operation === "none" ? "0′"
                  : (r.operation === "add" ? "+ " : "− ") + degMin(Math.abs(v.orech4 - v.orech3)),
               t: degMin(v.orech4) });
    out.push({ l: "מנת גובה המדינה", s: "שני שלישי הרוחב הראשון", a: "× ⅔", t: degMin(v.gov), drop: true });
    out.push({ l: v.north ? "תוסיף על האורך הרביעי" : "תגרע מן האורך הרביעי", s: "י״ז:י״ב",
               a: (v.north ? "+ " : "− ") + degMin(v.gov), t: degMin(v.keshet) });
    out.push({ l: link("kh17-15.html", "קשת הראייה"),
               s: Math.round(v.keshet * 4) + " דקות מן השקיעה עד שישקע הירח",
               a: "", t: degMin(v.keshet), out: true });
    return { rows: out, v: v, live: true };
  }

  /* paint() knows nothing of chapter headings; give them their own class */
  function paintAll(tbody, list) {
    var h = "";
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      var cls = r.head ? "head" : r.out ? "out" : r.drop ? "drop" : "";
      h += "<tr" + (cls ? ' class="' + cls + '"' : "") + '><td class="l">' + r.l +
           (r.s ? "<small>" + r.s + "</small>" : "") + '</td><td class="a">' + r.a +
           '</td><td class="t">' + r.t + "</td></tr>";
    }
    tbody.innerHTML = h;
  }

  function show(n) {
    var got = rows(n), v = got.v, d = v.verdict;
    paintAll(document.getElementById("led"), got.rows);
    document.getElementById("verdict").innerHTML =
      "<h3>" + (isLil(n) ? "ליל ראייה" : "ליל") +
        ' <span dir="ltr">' + civil(n) + "</span>" +
        ' · <span dir="ltr">' + n.toLocaleString() + "</span> ימים מן העיקר</h3>" +
      '<span class="say ' + (d.seen ? "yes" : "no") + '">' + (d.seen ? "ודאי ייראה" : "אינו נראה") +
      '</span><span class="mark">' + d.mark + "</span>" +
      '<span class="why">' + d.says + "</span>";
    document.getElementById("figs").hidden = !got.live;
    if (got.live) { markSky(v); markChain(v, "keshet"); }
    var iso = new Date(EPOCH + n * 86400000).toISOString().slice(0, 10);
    var dt = document.getElementById("date");
    if (document.activeElement !== dt) dt.value = iso;
    var dn = document.getElementById("dayn");
    if (document.activeElement !== dn) dn.value = n;
    document.getElementById("stamp").textContent =
      got.live ? "קשת הראייה " + degMin(v.keshet) + " · אורך ראשון " + degMin(v.orech1)
               : "אורך ראשון " + degMin(v.orech1);
  }

  function onDraw(n) { show(n); }

  function pageReady() {
    playing = false;
    if (el.play) el.play.textContent = "▶ Turn";
    document.getElementById("sky").innerHTML = skyFigure();
    document.getElementById("chain").innerHTML = chainFigure();

    document.getElementById("date").addEventListener("change", function (e) {
      var p = e.target.value.split("-");
      if (p.length !== 3) return;
      var n = Math.round((Date.UTC(+p[0], +p[1] - 1, +p[2]) - EPOCH) / 86400000);
      if (n >= 0) setDay(n);
    });
    document.getElementById("dayn").addEventListener("change", function (e) {
      var n = parseInt(e.target.value, 10);
      if (!isNaN(n) && n >= 0) setDay(n);
    });
    document.getElementById("lil").addEventListener("click", function () {
      setDay(nextLil(Math.floor(day)));
    });
    document.getElementById("his").addEventListener("click", function () { setDay(HIS_DAY); });

    /* Open on the night the calculation is for — the coming ליל ל׳, not on
       whatever tonight happens to be. */
    var t = new Date();
    var today = Math.round((Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) - EPOCH) / 86400000);
    setDay(nextLil(today - 1));
  }
})();
</script>
